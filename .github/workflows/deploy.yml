name: Build & deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# GitHub Pages serves the repo from a sub-path (/<repo>/), so the static export
# must be built with basePath set to that sub-path. CI sets PAGES_SUBPATH; for a
# custom domain that is "/", set PAGES_SUBPATH="" in the repo's Pages settings.
env:
  PAGES_SUBPATH: "/Jeff-the-carpenter"
  PAGES_OUTPUT: "out"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false
      - name: Build static export
        run: pnpm build
      - name: Verify output dir
        run: test -d "$PAGES_OUTPUT" && echo "output dir exists:" && ls -la "$PAGES_OUTPUT"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: $PAGES_OUTPUT

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
